metadata:
  description: "Plan a last-minute weekend dinner party on Friday: send one link, guests pick the day and say what they're bringing, and you lock in the best day. No guest accounts."
  logo_img: "asset:icon-512.png"
  title: "Plan Friday: plan a last-minute weekend dinner party"
name: Plan Friday
