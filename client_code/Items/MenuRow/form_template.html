<div class="menu-host">
  <div class="pl-mrow">
    <anvil-component type="TextBox" name="name_box" bind:text="self.item['name']"></anvil-component>
    <div class="pl-step" role="group" aria-label="How many">
      <anvil-component type="Button" name="less_button" prop:text="−" prop:role='["step"]'></anvil-component>
      <anvil-component type="Label" name="count" prop:role='["step-n"]'></anvil-component>
      <anvil-component type="Button" name="more_button" prop:text="+" prop:role='["step"]'></anvil-component>
    </div>
    <anvil-component type="Button" name="del_button" prop:text="Remove" prop:role='["btn", "btn-ghost", "btn-icon", "ic-trash"]'></anvil-component>
  </div>
</div>
